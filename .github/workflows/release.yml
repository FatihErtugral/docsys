name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl # static: no glibc requirement
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package
        run: |
          name="docsys-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/docsys" "$name/"
          cp README.md SPEC.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Release notes are the tag's section of CHANGELOG.md.
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '/^## /{p = index($0, "[" ver "]") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md 2>/dev/null || true
          shopt -s nullglob
          assets=(docsys-*.tar.gz docsys-*.tar.gz.sha256)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  # SHA256SUMS: a sha256sum line for every archive the release holds, so a
  # workflow checks the archive of the version its tree pins with no value
  # copied by hand. Read back from the release, it hashes what was published.
  sums:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern 'docsys-*.tar.gz' --dir dist
          cd dist
          sha256sum docsys-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
