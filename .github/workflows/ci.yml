name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  # The binary must stay able to lint its own conformance corpus and adopt a
  # fresh repository on every platform — the dogfood check.
  dogfood:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release --locked
      - name: end-to-end from a clean box (adopt · doctor · gate · kb · federation · export)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/target/release:$PATH"
          ./ci/e2e.sh
