# docsys-template: 9.9.9 sha256:@HASH@ branch=main runner=self-hosted,linux install=release root=docs
# docsys documentation workflow, written by `docsys adopt` (D-111). Line 1 records how
# it was rendered and a hash of everything else in this file: while the hash holds,
# docsys may regenerate it; once the file is edited, it is yours.
name: docsys

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    if: github.event.action != 'closed'
    runs-on: [self-hosted, linux]
    concurrency:
      group: docsys-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: docsys 9.9.9, the release the tree pins, checked against the sha256 its upgrade wrote
        shell: bash
        run: |
          # `docsys upgrade` wrote this version and its archives' sha256 values from
          # the release, reviewed with it: a pin moved alone installs nothing.
          v=$(head -n 1 "docs/.docsys-version" 2>/dev/null | tr -d '[:space:]' || true)
          if [ "$v" != "9.9.9" ]; then
            echo "docsys: docs/.docsys-version names ${v:-no version}, and this workflow installs 9.9.9 — run docsys upgrade --apply, which pins both" >&2
            exit 1
          fi
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=x86_64-unknown-linux-musl sum=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa ;;
            Linux-aarch64) target=aarch64-unknown-linux-musl sum=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb ;;
            Darwin-x86_64) target=x86_64-apple-darwin sum=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc ;;
            Darwin-arm64) target=aarch64-apple-darwin sum=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd ;;
            *) echo "docsys: no release archive for a $(uname -s)-$(uname -m) runner" >&2; exit 1 ;;
          esac
          name="docsys-v9.9.9-$target"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" "@RELEASES@/v9.9.9/$name.tar.gz"
          got=$(cd "$RUNNER_TEMP" && { sha256sum "$name.tar.gz" 2>/dev/null || shasum -a 256 "$name.tar.gz"; } | cut -d ' ' -f 1)
          if [ "$got" != "$sum" ]; then
            echo "docsys: $name.tar.gz hashes to $got, not the $sum this workflow pins" >&2
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - run: docsys lint --repo . --root docs
      - run: docsys refs --repo . --root docs
      - if: github.event_name == 'pull_request'
        run: docsys gate --repo . --root docs --range "origin/${{ github.base_ref }}...HEAD"
