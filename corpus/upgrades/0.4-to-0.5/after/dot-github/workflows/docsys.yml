# docsys-template: 0.17.0 sha256:2a185ed2d8be3f68b9616e344ff5e55b83ee0890eeafe1cc8d14a39d9f7c0832 branch=main runner=ubuntu-latest install=cargo root=docs
# docsys documentation workflow, written by `docsys adopt` (D-111). Line 1 records how
# it was rendered and a hash of everything else in this file: while the hash holds,
# docsys may regenerate it; once the file is edited, it is yours.
name: docsys

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: docsys-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: docsys, the version the tree pins
        id: docsys-pin
        shell: bash
        run: |
          v=$(head -n 1 "docs/.docsys-version" 2>/dev/null || true)
          echo "version=${v:-0.17.0}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: docsys-bin
        with:
          path: ~/.cargo/bin/docsys
          key: docsys-${{ steps.docsys-pin.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.docsys-bin.outputs.cache-hit != 'true'
        run: cargo install docsys --version "${{ steps.docsys-pin.outputs.version }}" --locked
      - run: docsys lint --repo . --root docs
      - run: docsys refs --repo . --root docs
      - if: github.event_name == 'pull_request'
        run: docsys gate --repo . --root docs --range "origin/${{ github.base_ref }}...HEAD"
